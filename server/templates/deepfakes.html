<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake Images</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        h1 {
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .image-container {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
        }
        .image-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin: 10px;
            padding: 10px;
            width: calc(25% - 20px);
            box-sizing: border-box;
        }
        .image-card img {
            max-width: 100%;
            border-radius: 8px;
        }
        .image-info {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Deepfake Images</h1>
        <div class="image-container" id="imageContainer">
            <!-- Images will be inserted here by JavaScript -->
        </div>
    </div>

    <script>
        async function fetchDeepfakes() {
            try {
                const response = await fetch('/deepfakes');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                const imageContainer = document.getElementById('imageContainer');
                imageContainer.innerHTML = ''; // Clear previous images
                
                if (data.length === 0) {
                    imageContainer.innerHTML = '<p>No deepfake images found.</p>';
                } else {
                    data.forEach(image => {
                        const imageCard = document.createElement('div');
                        imageCard.className = 'image-card';
                        imageCard.innerHTML = `
                            <img src="static/${image.url}" alt="Deepfake Image">
                            <div class="image-info">
                                <p>Path: ${image.path}</p>
                            </div>
                        `;
                        imageContainer.appendChild(imageCard);
                    });
                }
            } catch (error) {
                console.error('Error fetching deepfake images:', error);
                document.getElementById('imageContainer').innerHTML = '<p>Failed to load images.</p>';
            }
        }

        function refreshPage() {
            fetchDeepfakes();
            setTimeout(refreshPage, 30000); // Refresh every 30 seconds
        }

        window.onload = refreshPage;

        window.addEventListener('beforeunload', function () {
            navigator.sendBeacon('/close');
        });
    </script>
</body>
</html>
